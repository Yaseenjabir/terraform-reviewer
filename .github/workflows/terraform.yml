name: Terraform Plan

on: pull_request

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get the repository's code
        uses: actions/checkout@v5

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -out=tfplan -no-color

      - name: Convert plan to JSON
        working-directory: infra
        run: terraform show -json tfplan > plan.json

      - name: Summarize changes
        working-directory: infra
        run: |
          echo "Planned changes:"
          jq -r '.resource_changes[] | "  \(.change.actions | join("+"))  \(.address)"' plan.json

      - name: Comment on the pull request
        working-directory: infra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform Plan"
            echo '```'
            jq -r '.resource_changes[] | "\(.change.actions | join("+"))  \(.address)"' plan.json
            echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last --create-if-none

      - name: Fail if anything will be deleted
        working-directory: infra
        run: |
          DELETES=$(jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length' plan.json)
          echo "Resources to be deleted: $DELETES"
          if [ "$DELETES" -gt 0 ]; then
            echo "::error::This plan deletes $DELETES resource(s). A human must review it."
            exit 1
          fi
          echo "No deletions. Looks safe."
