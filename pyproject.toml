[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-reviewer"
version = "0.1.0"
description = "Reviews Terraform plans for risky changes and explains them in plain English"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
# LLM backends, needed only when the config turns one on.
llm = ["openai>=1.40", "anthropic>=2"]
dev = ["pytest>=8", "openai>=1.40", "anthropic>=2"]

[project.scripts]
tf-reviewer = "tf_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
